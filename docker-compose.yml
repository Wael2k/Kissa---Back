version: "3.8"
services:
  app:
    build:
      context: .
      dockerfile: DockerFile
    image: app
    ports:
      - "8080:8080"
    networks:
      - internal
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/kissa
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      - db

  nginx:
    build:
      context: .
      dockerfile: DockerFileProxy
    image: 50995452/ppp:nginx
    container_name: customProxy
    ports:
      - "80:80"
    networks:
      - internal
    depends_on:
      - app

  jenkins:
    build:
      context: .
      dockerfile: DockerFileJenkins
    image: jenkins
    container_name: jenkins-docker
    ports:
      - "8081:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - internal
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      JENKINS_USER: admin
      JENKINS_PASS: admin

  db:
    image: postgres:latest
    container_name: postgres
    ports:
      - "5432:5432"
    networks:
      - internal
    environment:
      POSTGRES_DB: kissa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin
    ports:
      - "5050:90"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: pgadmin
    depends_on:
      - db
    networks:
      - external
      - internal

volumes:
  postgres_data:
  jenkins_home:

networks:
  internal:
  external:
